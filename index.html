<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bizning oila daraxti</title>
<style>
:root{--bg:#f6efe3;--card:#fffdf8;--ink:#2b2118;--muted:#8a7a68;--accent:#b5562f;--line:#d6c2a5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#26201a;--ink:#f3e9d8;--muted:#a8977f;--accent:#e58a5f;--line:#4a3d2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#26201a;--ink:#f3e9d8;--muted:#a8977f;--accent:#e58a5f;--line:#4a3d2f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
header{text-align:center;padding:48px 12px 8px}
h1{margin:0;font-weight:normal;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:.5px}
.sub{color:var(--muted);font-style:italic;margin:10px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px 0 10px}
input,.btn{font:inherit;font-size:1rem;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input{width:min(300px,80vw)}
.btn{cursor:pointer}
.btn:hover{border-color:var(--accent)}
#stats{text-align:center;color:var(--muted);font-size:.9rem;margin:6px 0 0}
.gen{padding:24px 12px;text-align:center}
.gen+.gen::before{content:"";display:block;width:2px;height:36px;margin:0 auto 14px;background:linear-gradient(var(--line),transparent)}
.gen h2{font-weight:normal;font-style:italic;color:var(--muted);font-size:.95rem;letter-spacing:3px;text-transform:uppercase;margin:0 0 18px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:960px;margin:0 auto}
.card{width:170px;padding:20px 14px 18px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:0 6px 18px rgba(60,40,20,.08);cursor:pointer;font:inherit;transition:transform .25s,box-shadow .25s;animation:up .5s backwards;animation-delay:calc(var(--i,0)*80ms)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 12px 26px rgba(60,40,20,.14)}
.card:focus-visible,.chip:focus-visible,.btn:focus-visible,input:focus-visible,.x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.av{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 12px;border-radius:50%;background:hsl(var(--h) 42% 58%);color:#fff;font-size:1.3rem;font-weight:bold;letter-spacing:1px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.av.big{width:112px;height:112px;font-size:2.4rem;margin:0 auto 14px}
.nm{display:block;font-weight:bold;font-size:1.02rem}
.yr{display:block;color:var(--muted);font-size:.88rem;margin-top:4px}
.empty{color:var(--muted);font-style:italic;text-align:center}
footer{text-align:center;color:var(--muted);font-style:italic;padding:30px 12px 50px}
dialog{width:min(440px,92vw);padding:30px 26px;border:1px solid var(--line);border-radius:24px;background:var(--card);color:var(--ink);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,12,6,.5)}
.x{position:absolute;top:12px;right:16px;background:none;border:0;font-size:1.3rem;color:var(--muted);cursor:pointer}
dialog h3{margin:0;font-weight:normal;font-size:1.7rem}
blockquote{margin:18px 0;font-style:italic;line-height:1.65}
.rel{margin:12px 0;font-size:.95rem;color:var(--muted)}
.chip{font:inherit;font-size:.9rem;margin:3px;padding:5px 13px;border-radius:999px;border:1px solid var(--accent);background:none;color:var(--accent);cursor:pointer}
.chip:hover{background:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <h1>Bizning oila daraxti</h1>
  <p class="sub">Avlodlar bo’ylab bir hikoya — har bir ism ortida bir odam bor</p>
  <div class="tools">
    <input id="q" type="search" placeholder="Ism bo’yicha qidirish…" aria-label="Qidirish">
    <button class="btn" id="rnd">🎲 Tasodifiy a’zo</button>
  </div>
  <p id="stats"></p>
</header>

<main id="tree"></main>
<footer>Har bir odam — bir hikoya.</footer>

<dialog id="dlg">
  <button class="x" aria-label="Yopish">✕</button>
  <div id="body"></div>
</dialog>

<script>
/* ======= Oila ma'lumotlari: shu yerni o'zingizning oilangiz bilan almashtiring ======= */
const family = [
 {id:"karim",name:"Karim Rahimov",born:1938,died:2016,gen:0,spouse:"dilfuza",children:["aziz","nodira"],story:"Qishlog’imizning birinchi maktab o’qituvchisi edi. Har ertalab bog’iga suv sepib, nevaralariga qissalar aytib berardi."},
 {id:"dilfuza",name:"Dilfuza Rahimova",born:1942,gen:0,spouse:"karim",children:["aziz","nodira"],story:"Uning oshxonasi doim issiq va mehmonga to’la. Somsasi — oilaning eng sevimli taomi."},
 {id:"aziz",name:"Aziz Rahimov",born:1966,gen:1,spouse:"gulnora",children:["jasur","madina"],story:"Shahar zavodida muhandis bo’lib ishladi. Oilasi uchun doim ishonchli tayanch bo’ldi."},
 {id:"gulnora",name:"Gulnora Rahimova",born:1970,gen:1,spouse:"aziz",children:["jasur","madina"],story:"Kitob o’qishni va rasm chizishni yaxshi ko’radi. Oilaning barcha albomlarini o’zi tikkan."},
 {id:"nodira",name:"Nodira Rahimova",born:1969,gen:1,spouse:"bobur",children:["sardor"],story:"Shifokor. Qishloqdagi ko’plab bolalarni birinchi marta u davolagan."},
 {id:"bobur",name:"Bobur Qodirov",born:1965,gen:1,spouse:"nodira",children:["sardor"],story:"Dutorda chalishni yaxshi biladi. Oilaviy bayramlarning eng quvnoq mehmoni."},
 {id:"jasur",name:"Jasur Rahimov",born:1995,gen:2,children:[],story:"Dasturchi. Bobosining darslarini raqamli arxivda saqlab qolishni orzu qiladi."},
 {id:"madina",name:"Madina Rahimova",born:1998,gen:2,children:[],story:"Rassom. Bobosining qiyofasini ranglar orqali abadiylashtirgan."},
 {id:"sardor",name:"Sardor Qodirov",born:1993,gen:2,children:[],story:"Sayohatchi. Har yili yangi shaharga boradi va oilaga suratlar yuboradi."}
];
/* ==================================================================================== */

const $ = s => document.querySelector(s);
const byId = Object.fromEntries(family.map(p => [p.id, p]));
const parentsOf = id => family.filter(p => p.children.includes(id));
const initials = n => n.split(" ").map(w => w[0]).join("");
const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0);
const years = p => `${p.born} – ${p.died ?? "hozir"}`;
const GEN = ["Bobo-buvilar", "Ota-onalar", "Farzandlar", "Nevaralar"];
const dlg = $("#dlg");

function card(p, i) {
  return `<button class="card" data-id="${p.id}" style="--h:${hue(p.name)};--i:${i}">
    <span class="av">${initials(p.name)}</span>
    <span class="nm">${p.name}</span>
    <span class="yr">${years(p)}</span></button>`;
}

function render(q = "") {
  q = q.trim().toLowerCase();
  const gens = [...new Set(family.map(p => p.gen))].sort((a, b) => a - b);
  let html = "";
  for (const g of gens) {
    const list = family.filter(p => p.gen === g && p.name.toLowerCase().includes(q));
    if (list.length)
      html += `<section class="gen"><h2>${GEN[g]}</h2><div class="row">${list.map(card).join("")}</div></section>`;
  }
  $("#tree").innerHTML = html || `<p class="empty">Hech kim topilmadi.</p>`;
}

function open(id) {
  const p = byId[id];
  const rel = (label, ids) => ids.length
    ? `<div class="rel">${label} ${ids.map(i => `<button class="chip" data-id="${i}">${byId[i].name}</button>`).join("")}</div>`
    : "";
  $("#body").innerHTML = `
    <div class="av big" style="--h:${hue(p.name)}">${initials(p.name)}</div>
    <h3>${p.name}</h3>
    <span class="yr">${years(p)}</span>
    <blockquote>“${p.story}”</blockquote>
    ${rel("Ota-onasi:", parentsOf(id).map(x => x.id))}
    ${rel("Turmush o’rtog’i:", p.spouse ? [p.spouse] : [])}
    ${rel("Farzandlari:", p.children)}`;
  if (!dlg.open) dlg.showModal();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-id]");
  if (el) open(el.dataset.id);
});
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
$(".x").addEventListener("click", () => dlg.close());
$("#q").addEventListener("input", e => render(e.target.value));
$("#rnd").addEventListener("click", () => open(family[Math.random() * family.length | 0].id));

$("#stats").textContent =
  `${family.length} ta a’zo · ${new Set(family.map(p => p.gen)).size} ta avlod · ${Math.min(...family.map(p => p.born))} yildan beri`;
render();
</script>
</body>
</html>
